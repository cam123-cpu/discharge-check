name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege for every job; nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Pinned scanner versions; bump deliberately (Dependabot does not track these).
  PIP_AUDIT_VERSION: "2.10.1"
  BANDIT_VERSION: "1.9.4"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the release's checksums.txt
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
      - name: Audit runtime requirements
        # Resolves requirements.txt in an isolated env and checks PyPI/OSV advisories.
        run: pip-audit --strict --progress-spinner off -r requirements.txt

  sast:
    name: Static analysis (bandit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install bandit
        run: python -m pip install "bandit==${BANDIT_VERSION}"
      - name: Bandit (medium+ severity, medium+ confidence)
        # Low-severity B105 hits are dict literals like {"pass": 0}; medium and
        # above is where real findings live. False positives are silenced in
        # code with a justified `# nosec BXXX` on the line, never globally.
        run: bandit -r app scripts --severity-level medium --confidence-level medium

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not just the tip
          persist-credentials: false
      - name: Install gitleaks (checksum-verified release binary)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  container:
    name: Container (build, hadolint, Trivy, smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: info
      - name: Build image
        run: docker build --pull -t discharge-check:ci .
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Allow-rule for a false positive in the Anthropic SDK's docstrings.
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
        with:
          version: v0.70.0
          scan-type: image
          image-ref: discharge-check:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Smoke test (read-only container reaches healthy)
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/smoke.env"
          {
            echo "DATA_KEY=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            echo "SESSION_PEPPER=$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')"
            echo "FORCE_HTTPS=1"
            echo "ALLOWED_HOSTS=discharge.example.org"
          } > "$env_file"
          docker run -d --name smoke --env-file "$env_file" \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -v smoke-data:/data discharge-check:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          docker logs smoke
          test "$(docker inspect --format '{{.State.Health.Status}}' smoke)" = healthy
          # Must run as the fixed non-root user.
          test "$(docker exec smoke id -u)" = 10001
      - name: Clean up
        if: always()
        run: docker rm -f smoke >/dev/null 2>&1 || true
