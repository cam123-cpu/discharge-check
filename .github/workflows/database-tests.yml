name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  postgres:
    name: Postgres 16 / ubuntu-latest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dc
          POSTGRES_PASSWORD: dc
          POSTGRES_DB: dc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The suite wipes this database's public schema before each test.
      TEST_DATABASE_URL: postgresql://dc:dc@localhost:5432/dc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
