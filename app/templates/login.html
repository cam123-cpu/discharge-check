{% extends "base.html" %}
{% block title %}Sign in · Discharge Check{% endblock %}
{% block content %}
<div class="login">
  <h1>Sign in</h1>
  <p class="muted">Discharge Check flags discharge records that look incomplete. It reads what was uploaded. A person decides whether to sign.</p>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="pre" value="{{ pre }}">
    <label>Work email <input type="email" name="email" autocomplete="username" required maxlength="254"></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required maxlength="256"></label>
    <div class="hp" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
    <button type="submit" class="primary">Sign in</button>
  </form>
</div>
{% endblock %}
