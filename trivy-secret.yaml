# Trivy secret-scanner config (read automatically from the repo root via
# --secret-config, default "trivy-secret.yaml").
# Repository secrets are covered by gitleaks in CI; this tunes the image scan.
allow-rules:
  # The Anthropic SDK's docstrings mention service-account principals; the
  # gcp-service-account rule matches the placeholder text, not a credential.
  - id: anthropic-sdk-docstrings
    description: Third-party SDK source shipped in the venv, not our secrets
    path: ^opt/venv/lib/python3\.[0-9]+/site-packages/anthropic/
